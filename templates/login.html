<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroTune - Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="card">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="NeuroTune Logo" class="logo">
        <h1>NeuroTune</h1>
        <h2>Sign In</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="color:red;">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form onsubmit="return false;">
            <select id="userType">
                <option value="user">User</option>
                <option value="doctor">Doctor</option>
            </select>
            <input type="email" id="username" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="button" onclick="handleLogin()">Login</button>
        </form>
        <a href="/signup/user">New user? Sign up</a>
    </div>
    <script type ="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
